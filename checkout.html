  <!-- Checkout Content -->
  <h1>Checkout</h1>

  <div id="checkoutContent">
    <!-- Cart items will be shown here for review -->
  </div>

  <!-- Shipping Information Form -->
  <h2>Shipping Information</h2>
  <form id="shippingForm" method="POST">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required placeholder="Mr Marvin" pattern="[A-Za-z\s]{3,}" title="Name should contain at least 3 letters and no special characters" /><br><br>

    <label for="address">Shipping Address:</label>
    <textarea id="address" name="address" required placeholder="1234 Main St, City, Country" rows="4" pattern=".{10,}" title="Address should be at least 10 characters long"></textarea><br><br>

    <label for="city">City:</label>
    <input type="text" id="city" name="city" required placeholder="City Name" pattern="[A-Za-z\s]+" title="City should only contain letters" /><br><br>

    <label for="postal">Postal Code:</label>
    <input type="text" id="postal" name="postal" required placeholder="1234" pattern="\d{4}" title="Postal code should be 4 digits" /><br><br>

    <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" name="phone" required placeholder="+27 824 567 890"
       pattern="^\+27 \d{3} \d{3} \d{3}$" title="Phone number should follow the format +27 824 567 890" /><br><br>


    <button type="submit" class="btn btn-primary">Place Order</button>
  </form>

  <script src="checkout.js"></script>
</body>
